<!doctype html>
<html lang="en-GB">

    <style>
      :root {
        --bg: #eef2f7;
        --surface: #ffffff;
        --surface2: #f6f8fb;
        --ink: #1b2340;
        --ink2: #4b5563;
        --muted: #6b7280;
        --line: #d6dde8;
        --teal: #12939a;
        --amber: #f2a93b;
        --orange: #e08a3b;
        --green: #2fa76f;
        --red: #d9534f;
        --navy: #1b2340;
        --tealSoft: #e3f4f4;
        --amberSoft: #fff2dc;
        --greenSoft: #e3f5ec;
        --redSoft: #fbe7e6;
        --head: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
        --body: 'Atkinson Hyperlegible', Calibri, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1426;
          --surface: #1a2140;
          --surface2: #141a33;
          --ink: #e8ecf6;
          --ink2: #b8c1d6;
          --muted: #8a94ad;
          --line: #2c3559;
          --tealSoft: #123a40;
          --amberSoft: #3a2e17;
          --greenSoft: #163a2b;
          --redSoft: #3f1e22;
          color-scheme: dark;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0f1426;
        --surface: #1a2140;
        --surface2: #141a33;
        --ink: #e8ecf6;
        --ink2: #b8c1d6;
        --muted: #8a94ad;
        --line: #2c3559;
        --tealSoft: #123a40;
        --amberSoft: #3a2e17;
        --greenSoft: #163a2b;
        --redSoft: #3f1e22;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 17px;
        line-height: 1.55;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        z-index: 10;
        background: var(--navy);
      }
      h1,
      h2,
      h3 {
        font-family: var(--head);
        line-height: 1.15;
        margin: 0 0 0.4em;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      img {
        max-width: 100%;
      }
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--navy);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
      }
      .brand {
        font-family: var(--head);
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand small {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 11px;
        color: #9fb0d4;
      }
      .top .sp {
        flex: 1;
      }
      .chip {
        font-family: var(--mono);
        font-size: 13px;
        background: rgba(255, 255, 255, 0.1);
        padding: 5px 10px;
        border-radius: 20px;
        white-space: nowrap;
      }
      .chip b {
        color: var(--amber);
      }
      .tbtn {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 14px;
      }
      .tbtn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
      }
      .btn {
        background: var(--teal);
        color: #fff;
        border: 0;
        padding: 11px 20px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 16px;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--teal);
        border: 2px solid var(--teal);
      }
      .btn.amber {
        background: var(--amber);
        color: #1b2340;
      }
      input[type='text'],
      textarea,
      select {
        font: inherit;
        color: var(--ink);
        background: var(--surface2);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        width: 100%;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--teal);
      }
      /* start */
      .hero {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 28px;
        align-items: center;
        padding: 30px 0 10px;
      }
      .hero h1 {
        font-size: clamp(42px, 6vw, 76px);
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .hero p {
        font-size: 19px;
        color: var(--ink2);
        max-width: 60ch;
      }
      .hero .card {
        box-shadow: 0 10px 30px rgba(27, 35, 64, 0.08);
      }
      .lab {
        font-weight: 700;
        display: block;
        margin: 0 0 6px;
      }
      .tickets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 22px;
      }
      .ticket {
        position: relative;
        text-align: left;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 18px 18px 16px;
        color: var(--ink);
        min-height: 190px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ticket .code {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }
      .ticket h3 {
        font-size: 22px;
        margin: 2px 0 0;
      }
      .ticket .topic {
        color: var(--teal);
        font-weight: 700;
      }
      .ticket .client {
        color: var(--ink2);
        font-size: 15px;
      }
      .ticket .st {
        margin-top: auto;
        font-family: var(--mono);
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        align-self: flex-start;
      }
      .ticket.open {
        border-color: var(--teal);
      }
      .ticket.open:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(18, 147, 154, 0.15);
      }
      .ticket.done {
        border-color: var(--green);
      }
      .ticket.locked {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .ticket.boss {
        background: var(--navy);
        color: #fff;
        border-color: var(--amber);
      }
      .ticket.boss .client {
        color: #c7d2e3;
      }
      .ticket.boss .topic {
        color: var(--amber);
      }
      .st.s-open {
        background: var(--tealSoft);
        color: var(--teal);
      }
      .st.s-done {
        background: var(--greenSoft);
        color: var(--green);
      }
      .st.s-locked {
        background: var(--surface2);
        color: var(--muted);
      }
      .progress {
        height: 10px;
        background: var(--surface2);
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .progress i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--green));
      }

        flex-wrap: wrap;
        align-items: center;
      }

        display: flex;
        gap: 16px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 16px;

        color: var(--ink2);
      }

        gap: 20px;

      }

        top: 74px;
      }

        font-size: 21px;

        border-collapse: collapse;
        margin: 8px 0 12px;

        font-style: italic;
        padding: 6px 6px 2px;

      .brief ul {
        padding-left: 22px;
      }
      .brief li {
        margin: 3px 0;
      }

        display: inline-block;
        font-family: var(--mono);
        font-size: 12px;
        padding: 3px 9px;
        border-radius: 20px;
        background: var(--amberSoft);
        color: #8a5a0b;

        :root:not([data-theme='light']) .tag {
          color: var(--amber);

        margin-bottom: 16px;
      }

        opacity: 0.5;

      .task .qn {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .task .q {
        font-weight: 700;
        font-size: 18px;
        margin: 6px 0 12px;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--surface2);
        border: 2px solid var(--line);
        color: var(--ink);
        padding: 11px 14px;
        border-radius: 10px;
        margin: 8px 0;
      }
      .opt:hover {
        border-color: var(--teal);
      }
      .opt.sel {
        border-color: var(--teal);
        background: var(--tealSoft);
      }
      .mrow {
        display: grid;
        grid-template-columns: 1fr minmax(150px, 200px);
        gap: 10px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
      }
      .tfbtn {
        min-width: 92px;
        padding: 8px 12px;
        border-radius: 8px;
        border: 2px solid var(--line);
        background: var(--surface2);
        color: var(--ink);
        font-weight: 700;
      }
      .tfbtn.t {
        border-color: var(--green);
        color: var(--green);
      }
      .tfbtn.f {
        border-color: var(--red);
        color: var(--red);
      }
      .fb {
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 16px;
      }
      .fb.ok {
        background: var(--greenSoft);
      }
      .fb.no {
        background: var(--redSoft);
      }
      .fb.hint {
        background: var(--amberSoft);
      }

        color: var(--green);
        font-weight: 700;
      }

        border: 0;
        color: var(--muted);

        font-size: 14px;
        padding: 0;

        border-radius: 12px;
        padding: 12px;
        margin: 10px 0;

        font-family: var(--head);
        font-size: 18px;
        color: var(--orange);

        font-size: 13px;
        padding: 2px 10px;
        border-radius: 20px;
        color: #fff;
        margin: 8px 0 4px;

        background: var(--teal);
      }
      .p-r {
        background: var(--orange);
      }

        background: #2e3a63;

        white-space: pre-wrap;
        background: var(--surface2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
        font-size: 15px;
        max-height: 320px;
        overflow: auto;

        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);

        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 18px;

        color: var(--ink);

        border-radius: 10px;

        background: var(--tealSoft);

        gap: 0;

        border-radius: 12px;
        overflow: hidden;

      .gloss div {

        border-bottom: 1px solid var(--line);

        background: var(--surface2);

        text-align: center;
        padding: 40px 24px;

        margin: 20px auto;

        color: var(--teal);
        font-weight: 700;
      }

        justify-content: center;
        flex-wrap: wrap;
        margin: 16px 0;

        font-family: var(--mono);
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 20px;

        color: var(--green);

      .toast {

        transform: translateX(-50%);
        background: var(--navy);
        color: #fff;
        padding: 12px 20px;
        border-radius: 12px;
        font-weight: 700;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

      .toast b {

      }
      @media (max-width: 860px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .tickets {
          grid-template-columns: 1fr 1fr;
        }
        .zgrid {
          grid-template-columns: 1fr;
        }
        .brief {
          position: static;
          max-height: none;
        }
        .mrow {
          grid-template-columns: 1fr;
        }
        .gloss {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        .tickets {
          grid-template-columns: 1fr;
        }
        .top .chip.hide-sm {
          display: none;
        }
        main {
          padding: 16px 12px 50px;
        }
      }
      @media print {
        .top,
        .gtabs,
        .noprint {
          display: none !important;
        }
        body {
          background: #fff;
        }
        .brief {
          max-height: none;
          position: static;
        }
      }
    
      /* ---------- Cloud Quest v2 additions ---------- */
      .brief.solo { max-width: 860px; position: static; max-height: none; }
      .small-note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
      .briefbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 16px; }
      .gl { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 2px dotted var(--teal); cursor: help; position: relative; font-weight: inherit; }
      .gl:hover::after, .gl:focus::after {
        content: attr(data-def); position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; width: min(300px, 70vw);
        background: var(--navy); color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 15px; font-weight: 400; line-height: 1.35;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25); white-space: normal; text-align: left;
      }
      .gl:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
      .task.isdone { padding-top: 10px; padding-bottom: 10px; opacity: 0.85; }
      .task.isdone .qn { margin: 0; }
      .sortrow { grid-template-columns: 1fr auto; }
      .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
      .segb { font: inherit; font-size: 15px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
      .segb.on { background: var(--teal); border-color: var(--teal); color: #fff; }

      .sent:hover { border-color: var(--teal); }
      .sent.sel { border-color: var(--red); background: var(--redSoft); }

      .fb.reveal .expl { display: block; margin-top: 6px; }

      .btn.winter { background: #1b2340; color: #fff; border-color: #12939a; }
      .btn:disabled { cursor: not-allowed; }
      .modal { position: fixed; inset: 0; background: rgba(8, 11, 24, 0.6); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
      .modal .card { max-width: 560px; width: 100%; }

    <script>/* Nimbus shared quiz module (NQ).
 * Used by Cloud Quest v2 and Nimbus: Winter Shift. Works in the browser (window.NQ)
 * and in Node (require), so the build scripts run the same checks the games rely on.
 * No fixed seeds: every learner gets their own random choices.
 */
(function (root) {
  'use strict';

  // ---------- Randomness ----------
  // Uses the browser's (or Node's) cryptographic random source, so no two learners share an order.
  function randInt(n) {
    if (n <= 0) return 0;
    const c = (typeof crypto !== 'undefined' && crypto.getRandomValues) ? crypto
      : (typeof require === 'function' ? require('crypto').webcrypto : null);
    if (c) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / n) * n; // avoid modulo bias
      do { c.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }
    return Math.floor(Math.random() * n);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = randInt(i + 1);
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickOne(arr) { return arr[randInt(arr.length)]; }

  // Random subset of k items (order also shuffled).
  function sample(arr, k) { return shuffle(arr).slice(0, Math.min(k, arr.length)); }

  // ---------- Showing a multiple-choice question ----------
  // Returns the options in a fresh random order and where the correct one ended up.
  function presentOptions(options, correctIndex) {
    const order = shuffle(options.map((_, i) => i));
    return {
      order,                               // order[displayPos] = original index
      options: order.map((i) => options[i]),
      correct: order.indexOf(correctIndex), // display position of the correct option
    };
  }

  // ---------- Picking questions (no repeats, one per family) ----------
  // state = { used: [ids], fams: [familyIds] } is plain JSON so it can be saved.
  function newPickState() { return { used: [], fams: [] }; }

  function pickQuestion(bank, state, filter) {
    const inScope = bank.filter((q) => !filter || filter(q));
    if (!inScope.length) return null;
    let cands = inScope.filter((q) => state.used.indexOf(q.id) < 0 && state.fams.indexOf(q.family) < 0);
    if (!cands.length) {
      // Every family in scope already used this run (only after many wrong answers):
      // fall back to unseen questions, then, if the pool is empty, start the pool again.
      cands = inScope.filter((q) => state.used.indexOf(q.id) < 0);
      if (!cands.length) {
        const ids = inScope.map((q) => q.id);
        state.used = state.used.filter((id) => ids.indexOf(id) < 0);
        cands = inScope;
      }
    }
    const q = pickOne(cands);
    state.used.push(q.id);
    if (state.fams.indexOf(q.family) < 0) state.fams.push(q.family);
    return q;
  }

  // ---------- Variants (Cloud Quest) ----------
  // Choose one variant per task, once, when a learner starts. Returns {taskKey: variantIndex}.
  function pickVariants(tasks, keyOf) {
    const out = {};
    tasks.forEach((t, i) => {
      const n = t.variants ? t.variants.length : 1;
      out[keyOf ? keyOf(t, i) : i] = randInt(n);
    });
    return out;
  }

  // ---------- Attempts and cooldowns ----------
  // Cloud Quest rules: option tasks get 2 attempts, typed tasks 3. First-try correct = full XP,
  // a later correct = half XP, final wrong = answer shown and no XP. Returns what happens next.
  function attemptOutcome(attemptNo, maxAttempts, isCorrect) {
    if (isCorrect) return { result: 'correct', xpFactor: attemptNo === 1 ? 1 : 0.5 };
    if (attemptNo >= maxAttempts) return { result: 'reveal', xpFactor: 0 };
    return { result: 'retry', xpFactor: 0 };
  }

  // A cooldown is stored as a time it ends, so it survives a refresh.
  function cooldownUntil(seconds, now) { return (now || Date.now()) + seconds * 1000; }
  function cooldownLeft(until, now) {
    return Math.max(0, Math.ceil(((until || 0) - (now || Date.now())) / 1000));
  }
  // Runs onTick(secondsLeft) every 250ms until done, then onDone(). Returns a stop function.
  function runCooldown(until, onTick, onDone) {
    let stopped = false;
    function tick() {
      if (stopped) return;
      const left = cooldownLeft(until);
      if (onTick) onTick(left);
      if (left <= 0) { if (onDone) onDone(); return; }
      setTimeout(tick, 250);
    }
    tick();
    return function () { stopped = true; };
  }

  // ---------- Hashing and encoding ----------
  function djb2(s) {
    let h = 5381;
    for (const ch of String(s)) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0;
    return h;
  }

  // Decode content hidden with XOR + base64 (browser).
  function decode(b64, key) {
    const bin = atob(b64);
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
    return JSON.parse(new TextDecoder().decode(u));
  }

  // Encode (Node, build time only).
  function encode(obj, key) {
    const b = Buffer.from(JSON.stringify(obj), 'utf8');
    for (let i = 0; i < b.length; i++) b[i] ^= key.charCodeAt(i % key.length);
    return b.toString('base64');
  }

  // Short check value from a hash, using letters/digits that are hard to misread.
  const CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function checkChars(str, len) {
    let h = djb2(str), h2 = djb2(str.split('').reverse().join('') + '#');
    let out = '';
    for (let i = 0; i < (len || 4); i++) {
      const v = (i % 2 ? h2 : h);
      out += CODE_ALPHABET[v % CODE_ALPHABET.length];
      if (i % 2) h2 = Math.floor(h2 / CODE_ALPHABET.length); else h = Math.floor(h / CODE_ALPHABET.length);
    }
    return out;
  }

  // ---------- Build-time checks ----------
  // items: [{id, options:[...], correct:index}]
  // Warns when the correct option is the longest by more than 20% (spec 4.1 / 10.3).
  function optionLengthWarnings(items, ratio) {
    const r = ratio || 1.2;
    const warnings = [];
    for (const it of items) {
      const lens = it.options.map((o) => String(o).length);
      const c = lens[it.correct];
      const otherMax = Math.max.apply(null, lens.filter((_, i) => i !== it.correct));
      if (c > otherMax * r) {
        warnings.push(it.id + ': correct option is ' + c + ' chars, longest other is ' + otherMax +
          ' (' + Math.round((c / otherMax - 1) * 100) + '% longer)');
      }
    }
    return warnings;
  }

  // How often the correct option is the single longest, and where correct answers sit.
  function optionStats(items) {
    const pos = [0, 0, 0, 0, 0, 0];
    let longest = 0;
    for (const it of items) {
      pos[it.correct]++;
      const lens = it.options.map((o) => String(o).length);
      const c = lens[it.correct];
      if (lens.every((l, i) => i === it.correct || l < c)) longest++;
    }
    return { count: items.length, positions: pos.slice(0, 4), correctIsLongest: longest };
  }

  const NQ = {
    randInt, shuffle, pickOne, sample, presentOptions,
    newPickState, pickQuestion, pickVariants,
    attemptOutcome, cooldownUntil, cooldownLeft, runCooldown,
    djb2, decode, encode, checkChars, CODE_ALPHABET,
    optionLengthWarnings, optionStats,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = NQ;
  else root.NQ = NQ;
})(typeof window !== 'undefined' ? window : this);

              inner = `<div class="compiled" id="comp">${escU(bossText())}</div>
      <div class="rowflex noprint" style="margin:10px 0"><button class="btn ghost" id="cpy" type="button">Copy my answer</button></div>` +
                t.items.map((it, i) => `<label class="mrow" style="grid-template-columns:28px 1fr;cursor:pointer"><input type="checkbox" data-i="${i}" ${S.boss.checks[i] ? 'checked' : ''}><span>${esc(it)}</span></label>`).join('');
            }
          }
          el.innerHTML = sq(taskShell(zi, ti, inner, t.type === 'checklist' ? { btn: 'Close the ticket' } : t.type === 'write' ? { btn: 'Save field note' } : ['factor3', 'pre', 'conclusion'].includes(t.type) ? { btn: 'Save and continue' } : null));
          if (ti > st.idx || done) return;
          if (st.revealed[k]) return showReveal(zi, ti, el);
          // interactions
          if (t.type === 'mc' || t.type === 'spot') {
            const sel = t.type === 'mc' ? '.opt' : '.sent';
            $$(el, sel).forEach((b) => (b.onclick = () => { $$(el, sel).forEach((x) => x.classList.remove('sel')); b.classList.add('sel'); }));
          }
          if (t.type === 'factor3') $$(el, '.opt').forEach((b) => (b.onclick = () => b.classList.toggle('sel')));
          if (t.type === 'sort') $$(el, '.sortrow').forEach((row) => $$(row, '.segb').forEach((b) => (b.onclick = () => {
            $$(row, '.segb').forEach((x) => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); });
            b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); row.dataset.v = b.dataset.c;
          })));
          if (t.type === 'write') {
            const ta = el.querySelector('textarea');
            ta.oninput = () => { el.querySelector('.cnt').textContent = words(ta.value); S.notes[z.id + '_' + ti] = ta.value; save(); };
          }
          if (t.type === 'pre') $$(el, 'textarea').forEach((ta) => (ta.oninput = () => { const f = ta.dataset.f; S.boss.pre[f] = S.boss.pre[f] || {}; S.boss.pre[f][ta.dataset.x] = ta.value; save(); }));
          if (t.type === 'conclusion') $$(el, 'textarea').forEach((ta) => (ta.oninput = () => { S.boss.concl[ta.dataset.x] = ta.value; save(); }));
          if (t.type === 'checklist') {
            el.querySelector('#cpy').onclick = () => copyText(bossText());
            $$(el, 'input[type=checkbox]').forEach((c) => (c.onchange = () => { S.boss.checks[+c.dataset.i] = c.checked; save(); }));
          }
          if (t.type === 'text') el.querySelector('.ans').onkeydown = (e) => { if (e.key === 'Enter') el.querySelector('.chk').click(); };
          const tb = el.querySelector('.tutor');
          if (tb) tb.onclick = () => {
            const code = prompt('Tutor code:');
            if (code && NQ.djb2(code.trim().toUpperCase()) === TUTOR_H) complete(zi, ti, 0, true);
            else if (code !== null) fb(el, 'no', 'That code isn’t right. Ask your tutor.');
          };
          const chk = el.querySelector('.chk');
          el.dataset.ready = String(Math.max(Date.now(), st.cool[k] || 0));
          chk.onclick = () => check(zi, ti, el);
          // [10.3.3] a cooldown survives a refresh
          if ((st.cool[k] || 0) > Date.now()) startCooldown(zi, ti, el);
        }
        function fb(el, cls, html) {
          el.querySelector('.fbx').innerHTML = `<div class="fb ${cls}">${sq(html)}</div>`;
        }
        function startCooldown(zi, ti, el) {
          const st = zs(Z[zi].id), k = 'a' + ti, chk = el.querySelector('.chk');
          const label = chk.textContent;
          NQ.runCooldown(st.cool[k], (n) => {
            if (!document.body.contains(chk)) return;
            chk.disabled = n > 0;
            chk.textContent = n > 0 ? 'Try again in ' + n + ' s' : label;
          });
        }

        // [10.3.8: written answers must be real answers] quality check for written tasks
        function writtenProblem(t, v) {
          const n = norm(v), w = n.split(' ').filter(Boolean);
          if (words(v) < t.min) return `A bit more, please: at least ${t.min} words. Have you got a point, a reason and a “so…”?`;
          if (new Set(w).size < w.length * 0.55) return 'Too many repeated words. Write it in your own sentences.';
          if (norm(t.placeholder) && n === norm(t.placeholder)) return 'Finish the sentence in your own words.';
          const need = t.need || {};
          const has = (x) => (' ' + n + ' ').includes(' ' + norm(x) + ' ') || n.split(' ').some((word) => word.startsWith(norm(x)) && norm(x).length >= 4);
          const missingAll = (need.all || []).filter((x) => !has(x));
          if (missingAll.length) return `Use the word${missingAll.length > 1 ? 's' : ''} “${missingAll.join('”, “')}” in your answer.`;
          if (need.frame && !need.frame.some(has)) return 'Where is your “so what?”. Add “so…” and say what it means for the client.';
          if (need.any && need.any.filter(has).length < (need.anyN || 1)) return 'Make it about the scenario: name the client and use the key words from the job.';
          return '';
        }

        function evaluate(zi, ti, el) {
          const t = V(zi, ti);
          if (t.type === 'mc' || t.type === 'spot') {
            const s = el.querySelector(t.type === 'mc' ? '.opt.sel' : '.sent.sel');
            if (!s) return { empty: t.type === 'mc' ? 'Pick an answer first.' : 'Click the sentence you think is wrong.' };
            return { ok: +s.dataset.i === (t.type === 'mc' ? t.answer : t.wrong) };
          }
          if (t.type === 'text') {
            const v = norm(el.querySelector('.ans').value);
            if (!v) return { empty: 'Type an answer first.' };
            return { ok: t.accept.some((a) => fuzzyHas(v, a)) };
          }
          if (t.type === 'keywords') {
            const v = norm(el.querySelector('.ans').value);
            if (!v) return { empty: 'Type your answer first.' };
            const miss = t.groups.filter((g) => !g.some((w) => fuzzyHas(v, w) || v.includes(w))).length;
            return { ok: miss === 0, msg: miss ? `You have ${t.groups.length - miss} of the ${t.groups.length}. ` : '' };
          }
          if (t.type === 'sort') {
            const rows = $$(el, '.sortrow');
            if (rows.some((r) => r.dataset.v == null)) return { empty: 'Choose a column for every row.' };
            const right = rows.filter((r) => +r.dataset.v === t.pool[+r.dataset.ii].a).length;
            return { ok: right === rows.length, msg: right === rows.length ? '' : `${right} of ${rows.length} correct. ` };
          }
          if (t.type === 'match' || t.type === 'order') {
            const sels = $$(el, 'select');
            if (sels.some((s) => s.value === '')) return { empty: 'Choose an option for every row.' };
            const right = sels.filter((s) => +s.value === (t.type === 'order' ? +s.dataset.ii : t.pool[+s.dataset.ii].a)).length;
            return { ok: right === sels.length, msg: right === sels.length ? '' : `${right} of ${sels.length} correct. ` };
          }
          return { ok: false };
        }

        function check(zi, ti, el) {
          const z = Z[zi], t = V(zi, ti), st = zs(z.id), k = 'a' + ti;
          if ((st.cool[k] || 0) > Date.now()) return;
          if (t.type === 'write') {
            const v = el.querySelector('textarea').value;
            const p = writtenProblem(t, v);
            if (p) return fb(el, 'hint', p);
            S.notes[z.id + '_' + ti] = v;
            return complete(zi, ti, 1, false, true);
          }
          if (t.type === 'factor3') {
            const s = $$(el, '.opt.sel').map((b) => b.dataset.f);
            if (s.length !== 3) return fb(el, 'hint', `Choose exactly three factors (you have ${s.length}).`);
            S.boss.factors = s;
            S.boss.factors.forEach((f) => (S.boss.pre[f] = S.boss.pre[f] || {}));
            return complete(zi, ti, 1, false, true);
          }
          if (t.type === 'pre') {
            const short = S.boss.factors.filter((f) => ['p', 'r', 'e'].some((x) => words((S.boss.pre[f] || {})[x]) < 4));
            if (short.length) return fb(el, 'hint', `Add more to ${short.join(', ')}: every box needs at least 4 words.`);
            const noSeren = S.boss.factors.filter((f) => !/seren|consultant|candidate|rural|cv|database/i.test(Object.values(S.boss.pre[f]).join(' ')));
            if (noSeren.length) return fb(el, 'hint', `${noSeren.join(', ')}: use the scenario. Mention Seren, its consultants, the CVs, the database or the rural staff.`);
            return complete(zi, ti, 1, false, true);
          }
          if (t.type === 'conclusion') {
            const c = S.boss.concl;
            if (['o', 'b', 'h'].some((x) => words(c[x]) < 5)) return fb(el, 'hint', 'Each part of the conclusion needs at least 5 words.');
            if (!/vpn|remote desktop|both/i.test(c.o)) return fb(el, 'hint', 'Your “Overall” must make a decision: VPN, remote desktop, or both.');
            return complete(zi, ti, 1, false, true);
          }
          if (t.type === 'checklist') {
            if (t.items.some((_, i) => !S.boss.checks[i])) return fb(el, 'hint', 'Tick every box. If one isn’t true yet, scroll up and fix your answer first.');
            return complete(zi, ti, 1, false, true);
          }
          const r = evaluate(zi, ti, el);
          if (r.empty) return fb(el, 'hint', r.empty);
          const attemptNo = (st.att[k] || 0) + 1;
          if (attemptNo === 1) { S.acc.total++; if (r.ok) S.acc.first++; }
          const out = NQ.attemptOutcome(attemptNo, maxAttempts(t), r.ok);
          if (out.result === 'correct') return complete(zi, ti, out.xpFactor);
          st.att[k] = attemptNo;
          if (!S.firstWrong.includes(z.id + '#' + (ti + 1))) S.firstWrong.push(z.id + '#' + (ti + 1));
          if (out.result === 'reveal') {
            st.revealed[k] = Date.now();
            save();
            return renderZone(zi);
          }
          const rushed = Date.now() - (+el.dataset.ready || 0) < RUSH * 1000;
          st.cool[k] = NQ.cooldownUntil(rushed ? RUSH_COOLDOWN : COOLDOWN);
          save();
          // re-render so the options shuffle again, then show the hint
          renderTask(zi, ti);
          fb(el, 'no', (rushed ? `That was very quick, so you wait ${RUSH_COOLDOWN} s. Read the question properly. ` : '') + (r.msg || '') + `Not quite. ${t.hint ? 'Hint: ' + esc(t.hint) + ' ' : ''}You have ${maxAttempts(t) - attemptNo} ${maxAttempts(t) - attemptNo === 1 ? 'try' : 'tries'} left${maxAttempts(t) - attemptNo === 1 ? ' for half XP' : ''}.`);
        }

        // [10.3.3] After the final wrong attempt: show the answer and explanation, no XP.
        function showReveal(zi, ti, el) {
          const t = V(zi, ti), st = zs(Z[zi].id), k = 'a' + ti;
          let ans = '';
          if (t.type === 'mc') ans = `The answer is <b>${esc(t.options[t.answer])}</b>.`;
          if (t.type === 'spot') ans = `The mistake is: <b>${esc(t.sentences[t.wrong])}</b>`;
          if (t.type === 'text' || t.type === 'keywords') ans = `Model answer: <b>${esc(t.model)}</b>`;
          if (t.type === 'order') ans = 'The right order is:<ol>' + t.steps.map((s) => `<li>${esc(s)}</li>`).join('') + '</ol>';
          if (t.type === 'sort' || t.type === 'match') {
            const cols = t.type === 'sort' ? t.columns : t.choices;
            ans = 'The answers are:<ul>' + items(zi, ti).map((ii) => `<li>${esc(t.pool[ii].t)} → <b>${esc(cols[t.pool[ii].a])}</b></li>`).join('') + '</ul>';
          }
          el.querySelector('.fbx').innerHTML = `<div class="fb reveal">${sq(`<b>Out of tries, so no XP for this one.</b> ${ans} <span class="expl">${esc(t.explain || '')}</span>`)}
            <div class="rowflex" style="margin-top:10px"><button class="btn" id="contReveal" type="button" disabled>Read the answer (${REVEAL_READ})</button></div></div>`;
          const b = el.querySelector('#contReveal');
          NQ.runCooldown(st.revealed[k] + REVEAL_READ * 1000, (n) => { if (!document.body.contains(b)) return; b.disabled = n > 0; b.textContent = n > 0 ? 'Read the answer (' + n + ')' : 'Got it: next task'; });
          b.onclick = () => { if (!b.disabled) complete(zi, ti, 0); };
        }

        function complete(zi, ti, factor, tutor, written) {
          const z = Z[zi], st = zs(z.id), k = 'a' + ti;
          if (ti !== st.idx || st.done) return;
          const pts = tutor ? 0 : Math.round((z.boss ? 150 : 100) * factor);
          S.xp += pts;
          st.earned += pts;
          st.pts[k] = pts;
          delete st.revealed[k];
          st.idx = ti + 1;
          if (st.idx >= z.tasks.length) { st.done = true; S.xp += z.boss ? 500 : 100; }
          save();
          toast(tutor ? 'Unlocked by tutor' : `+${pts} XP${st.done ? ` · Ticket closed! <b>+${z.boss ? 500 : 100} bonus</b>` : ''}`);
          if (st.done && z.boss) { location.hash = 'certificate'; route(); return; }
          renderZone(zi);
        }

        function bossText() {
          const b = S.boss;
          let s = `Discuss which remote working system Seren Recruitment should use: a VPN or remote desktop. (6 marks)\n\n`;
          b.factors.forEach((f) => {
            const v = b.pre[f] || {};
            s += `${f}: ${[v.p, v.r, v.e].filter(Boolean).map((x) => x.trim().replace(/\.?$/, '.')).join(' ')}\n\n`;
          });
          const c = b.concl;
          s += `Overall, ${(c.o || '').trim()} because ${(c.b || '').trim()} However, ${(c.h || '').trim()}`;
          return s;
        }
        function copyText(txt) {
          const done = () => toast('Copied. Paste it into your C1 Google Site page.');
          if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallback());
          else fallback();
          function fallback() {
            const ta = document.createElement('textarea');
            ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (e) { alert('Select the text and copy it with Ctrl+C.'); }
            ta.remove();
          }
        }

        /* GUIDE */
        let gTab = 'notes';
        function renderGuide() {
          header();
          const busy = inProgress();
          // [10.3.2] briefings are only in the guide once their job is closed, so it can't be used to dodge the hidden briefing
          const open = Z.filter((z) => zoneDone(z.id));
          if (busy && gTab === 'terms') gTab = 'notes';
          let h = `<h1 style="font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-.02em;margin:0">Field guide</h1>
    <p style="color:var(--ink2);margin:4px 0 0">Everything you’ve unlocked, for revision. Come back to it any time before the January exam.</p>
    <div class="gtabs noprint"><button data-t="notes" class="${gTab === 'notes' ? 'on' : ''}">My field notes</button>${busy ? '' : `<button data-t="terms" class="${gTab === 'terms' ? 'on' : ''}">Key terms</button>`}${open.map((z) => `<button data-t="${z.id}" class="${gTab === z.id ? 'on' : ''}">${esc(z.title)}</button>`).join('')}</div>`;
          if (busy) h += `<p class="small-note">Key terms and the briefing for <b>${esc(busy.title)}</b> unlock here when you close that job.</p>`;
          if (gTab === 'notes') {
            const all = exportText();
            h += `<div class="card"><h3>My field notes and boss answer</h3><p>Copy these into your C1 Google Site page.</p><div class="compiled">${escU(all)}</div>
      <div class="rowflex noprint" style="margin-top:12px"><button class="btn" id="cpAll" type="button">Copy everything</button><button class="btn ghost" id="pr" type="button">Print</button></div>
      ${S.firstWrong.length ? `<h3 style="margin-top:22px">Revise these</h3><p>Questions you got wrong first time: ${S.firstWrong.map((x) => { const [zid, n] = x.split('#'); const zz = Z.find((q) => q.id === zid); return esc(zz.title + ' task ' + n); }).join(', ')}.</p>` : ''}</div>`;
          } else if (gTab === 'terms') {
            h += `<div class="gloss">${CQ.glossary.map((g) => `<div>${esc(g[0])}</div><div>${esc(g[1])}</div>`).join('')}</div>`;
          } else {
            const z = Z.find((q) => q.id === gTab);
            h += `<article class="card brief" style="position:static;max-height:none"><span class="tag">${esc(z.handbook)}</span><h2 style="margin-top:10px">${esc(z.title)}: ${esc(z.topic)}</h2>${briefHTML(z)}</article>`;
          }
          $('#app').innerHTML = sq(h).replace(/IMG_(D\d)/g, (m, k) => `<img alt="${escU(IMGALT[k])}" src="${IMGS[k]}">`);
          document.querySelectorAll('.gtabs button').forEach((b) => (b.onclick = () => { gTab = b.dataset.t; renderGuide(); }));
          const c = $('#cpAll');
          if (c) c.onclick = () => copyText(exportText());
          const p = $('#pr');
          if (p) p.onclick = () => window.print();
        }
        function exportText() {
          let s = `Cloud Quest field notes: ${S.name}\n\n`;
          let any = false;
          Z.forEach((z) => z.tasks.forEach((t, ti) => {
            if (t.type === 'write' && S.notes[z.id + '_' + ti] && (S.z[z.id] || {}).idx > ti) {
              any = true;
              s += `${t.log}\n${S.notes[z.id + '_' + ti].trim()}\n\n`;
            }
          }));
          if (zoneDone('z6')) { any = true; s += `Boss level: Seren Recruitment\n${bossText()}\n`; }
          return any ? s : 'Your field notes will appear here as you complete each job.';
        }

        /* TUTOR PANEL  [10.3.7] Reset this PC clears the v2 save only */
        function openTutor() {
          const code = prompt('Tutor code:');
          if (code === null) return;
          if (NQ.djb2(code.trim().toUpperCase()) !== TUTOR_H) { toast('That code isn’t right.'); return; }
          const d = document.createElement('div');
          d.className = 'modal';
          d.innerHTML = sq(`<div class="card" role="dialog" aria-modal="true" aria-labelledby="tpT"><h2 id="tpT" style="margin-top:0">Tutor panel</h2>
            <p>${S.name ? 'Signed in: <b>' + escU(S.name) + '</b> · ' + S.xp + ' XP · ' + rank() + ' · ' + accPct() + '% first time.' : 'No one is signed in on this PC.'}</p>
            <p><button class="btn" id="tpReset" type="button">Reset this PC (Cloud Quest v2 only)</button></p>
            <p class="small-note">This clears only the v2 save. Any old v1 progress on this PC is not touched and still shows in the backup page.</p>
            <div class="rowflex"><button class="btn ghost" id="tpClose" type="button">Close</button></div></div>`);
          document.body.appendChild(d);
          d.querySelector('#tpClose').onclick = () => d.remove();
          d.querySelector('#tpClose').focus();
          d.querySelector('#tpReset').onclick = () => {
            if (!confirm('Reset Cloud Quest v2 on this PC? This deletes the v2 progress saved in this browser.')) return;
            try { localStorage.removeItem(KEY); } catch (e) {}
            S = blank();
            d.remove();
            location.hash = '';
            route();
            toast('Cloud Quest v2 reset on this PC.');
          };
        }

        /* CERT */
        function renderCert() {
          header();
          const d = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
          const r = rank();
          $('#app').innerHTML = sq(`<div class="cert"><p style="font-family:var(--mono);color:var(--muted);margin:0">NIMBUS IT · CLOUD QUEST COMPLETE</p><h1>All six tickets closed</h1>
    <p>This certifies that</p><div class="name">${escU(S.name)}</div><p>completed Cloud Quest for BTEC Unit 1, C1 Online Systems, with</p>
    <p style="font-family:var(--head);font-size:40px;font-weight:800;margin:0">${S.xp} XP</p><p>Rank: <b>${r}</b> · ${accPct()}% right first time · ${d}</p>
    ${r === 'Cloud Architect' ? '' : `<p style="color:var(--ink2);font-size:15px">Top rank (Cloud Architect) needs 80% of the XP and 70% right first time.</p>`}
    <div class="badges">${Z.map((z) => `<span class="badge">✓ ${esc(z.title)}</span>`).join('')}</div>
    <p style="color:var(--ink2)">Screenshot this for your C1 Google Site page, then copy your field notes and boss answer from the field guide.</p>
    <div class="rowflex noprint" style="justify-content:center"><a class="btn" href="#guide" style="text-decoration:none">Open field guide</a><a class="btn ghost" href="#board" style="text-decoration:none">Job board</a><a class="btn ghost" href="winter.html" style="text-decoration:none">Winter Shift ❄</a></div></div>`);
        }

        load();
        if (S.name) choosePicks();
        route();
        // Read-only hook for automated tests (state only; never which answer is correct).
        window.__cq = { get state() { return S; } };
      })();
</script>
  </body>
</html>
